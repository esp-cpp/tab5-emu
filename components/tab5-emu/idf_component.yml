## IDF Component Manager Manifest File
dependencies:
  idf: '>=6.0'
  lvgl/lvgl: '>=9.2.2'
  # >= 1.3.4: powers the SD card IO rail through the P4's LDO (SDMMC works).
  # TEMPORARY: local espp (branch feat/touch-multi-point) for the multi-touch
  # state (every finger, for the virtual gamepad) until a release carries it;
  # same for the touch interface and the ST7123 touch driver it flows through.
  espp/m5stack-tab5:
    version: '>=1.3.4'
    override_path: '../../../espp/components/m5stack-tab5'
  espp/touch:
    version: '>=1.3.5'
    override_path: '../../../espp/components/touch'
  espp/st7123touch:
    version: '>=1.3.5'
    override_path: '../../../espp/components/st7123touch'
  espp/event_manager: '>=1.3'
  espp/timer: '>=1.3'
  # USB mass storage (the SD card as a USB drive), brings esp_tinyusb; needs
  # UsbDevice::Config::port (the Tab5's USB-C is the P4's full-speed port)
  espp/usb_device: '>=1.3.5'
  espp/sdcard: '>=1.0'
  # crash reports + core dump download at boot
  espp/coredump: '>=1.3.5'
  # USB host (HID keyboard / mouse / gamepad on the USB-A jack): needs
  # UsbHost's full_speed_only / task_stack_alloc_caps and the close-on-driver-
  # task fix, the hid-rp runtime report map, and Task::stack_alloc_caps
  espp/usb_host: '>=1.3.5'
  espp/hid-rp: '>=1.3.5'
  espp/task: '>=1.3.5'
