## IDF Component Manager Manifest File
dependencies:
  idf: '>=6.0'
  lvgl/lvgl: '>=9.2.2'
  # >= 1.3.4: powers the SD card IO rail through the P4's LDO (SDMMC works)
  espp/m5stack-tab5: '>=1.3.4'
  espp/event_manager: '>=1.3'
  espp/task: '>=1.3'
  espp/timer: '>=1.3'
  espressif/usb_host_hid: '^1.0.2'
  # USB mass storage (the SD card as a USB drive), brings esp_tinyusb
  # TEMPORARY: local espp (branch feat/usb-device-port) until a release carries
  # UsbDevice::Config::port; the Tab5's USB-C is the P4's full-speed port
  espp/usb_device:
    version: '>=1.3.4'
    override_path: '../../../espp/components/usb_device'
  espp/sdcard: '>=1.0'
